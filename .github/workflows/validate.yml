name: Validate yougan platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  content-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in web/*.js; do node --check "$file" || exit 1; done
      - run: node --test tests/*.test.mjs
      - run: node scripts/build.mjs
